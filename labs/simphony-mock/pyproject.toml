[project]
name = "poma-simphony-mock"
version = "0.1.0"
description = "Laboratorio reproducible de un subconjunto documentado de Oracle Simphony STSG2"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simphony_mock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
